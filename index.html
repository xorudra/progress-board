    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --error-color: #cf6679;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .update-time {
            color: var(--secondary-color);
            font-size: 0.9em;
        }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .project-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .project-title {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 1.2em;
        }

        .status-line {
            margin: 10px 0;
            color: var(--text-color);
        }

        .progress-container {
            margin: 15px 0;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .progress-bar {
            height: 8px;
            background-color: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--secondary-color);
            border-radius: 4px;
        }

        .live-link {
            display: inline-block;
            margin: 10px 0;
            color: var(--secondary-color);
            text-decoration: none;
        }

        .live-link:hover {
            text-decoration: underline;
        }

        .commits-list {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
        }

        .commit-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .commit-hash {
            background-color: #333;
            color: var(--text-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8em;
            margin-right: 10px;
        }

        .commit-subject {
            flex-grow: 1;
        }

        .commit-date {
            color: #777;
            font-size: 0.8em;
        }

        .no-data {
            text-align: center;
            color: #777;
            font-style: italic;
            margin-top: 30px;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dataElement = document.getElementById('board-data');
            const projectsContainer = document.getElementById('projects-container');
            const generatedAtElement = document.getElementById('generated-at');

            if (!dataElement || !projectsContainer || !generatedAtElement) {
                console.error('Required elements not found');
                return;
            }

            try {
                const data = JSON.parse(dataElement.textContent);

                if (!data || Object.keys(data).length === 0) {
                    // Show no data message
                    projectsContainer.innerHTML = '<div class="no-data">No data yet</div>';
                    return;
                }

                // Update generated at time
                if (data.generated_at) {
                    generatedAtElement.textContent = data.generated_at;
                }

                // Clear existing content
                projectsContainer.innerHTML = '';

                // Render projects
                if (data.projects && data.projects.length > 0) {
                    data.projects.forEach(project => {
                        const projectCard = document.createElement('div');
                        projectCard.className = 'project-card';

                        // Project title
                        if (project.name) {
                            const titleElement = document.createElement('h2');
                            titleElement.className = 'project-title';
                            titleElement.textContent = project.name;
                            projectCard.appendChild(titleElement);
                        }

                        // Status line
                        if (project.status_line) {
                            const statusElement = document.createElement('div');
                            statusElement.className = 'status-line';
                            statusElement.textContent = project.status_line;
                            projectCard.appendChild(statusElement);
                        }

                        // Progress bar
                        if (project.progress) {
                            const progressContainer = document.createElement('div');
                            progressContainer.className = 'progress-container';

                            if (project.progress.label) {
                                const progressLabel = document.createElement('div');
                                progressLabel.className = 'progress-label';
                                progressLabel.innerHTML = `<span>${project.progress.label}</span><span>${project.progress.done}/${project.progress.total}</span>`;
                                progressContainer.appendChild(progressLabel);
                            }

                            const progressBar = document.createElement('div');
                            progressBar.className = 'progress-bar';

                            const progressFill = document.createElement('div');
                            progressFill.className = 'progress-fill';
                            if (project.progress.done && project.progress.total) {
                                const percentage = (project.progress.done / project.progress.total) * 100;
                                progressFill.style.width = `${percentage}%`;
                            }

                            progressBar.appendChild(progressFill);
                            progressContainer.appendChild(progressBar);
                            projectCard.appendChild(progressContainer);
                        }

                        // Live URL
                        if (project.live_url) {
                            const liveLink = document.createElement('a');
                            liveLink.className = 'live-link';
                            liveLink.href = project.live_url;
                            liveLink.textContent = 'Live site';
                            liveLink.target = '_blank';
                            liveLink.rel = 'noopener noreferrer';
                            projectCard.appendChild(liveLink);
                        }

                        // Commits
                        if (project.commits && project.commits.length > 0) {
                            const commitsList = document.createElement('ul');
                            commitsList.className = 'commits-list';

                            project.commits.forEach(commit => {
                                const commitItem = document.createElement('li');
                                commitItem.className = 'commit-item';

                                const commitHash = document.createElement('span');
                                commitHash.className = 'commit-hash';
                                commitHash.textContent = commit.hash.substring(0, 7);

                                const commitSubject = document.createElement('span');
                                commitSubject.className = 'commit-subject';
                                commitSubject.textContent = commit.subject;

                                const commitDate = document.createElement('span');
                                commitDate.className = 'commit-date';
                                commitDate.textContent = commit.date;

                                commitItem.appendChild(commitHash);
                                commitItem.appendChild(commitSubject);
                                commitItem.appendChild(commitDate);
                                commitsList.appendChild(commitItem);
                            });

                            projectCard.appendChild(commitsList);
                        }

                        projectsContainer.appendChild(projectCard);
                    });
                } else {
                    projectsContainer.innerHTML = '<div class="no-data">No projects to display</div>';
                }
            } catch (error) {
                console.error('Error parsing or rendering data:', error);
                projectsContainer.innerHTML = '<div class="no-data">Error loading data</div>';
            }
        });
    </script>
